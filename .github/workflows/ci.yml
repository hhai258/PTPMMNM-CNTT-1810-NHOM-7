name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: ffm_test, MYSQL_USER: ffm, MYSQL_PASSWORD: ffm_pass }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: mysqli, mbstring }
      - name: Kiểm tra cú pháp
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Chạy kiểm thử
        env: { FFM_DB_HOST: 127.0.0.1, FFM_DB_USER: ffm, FFM_DB_PASS: ffm_pass, FFM_DB_NAME: ffm_test }
        run: bash tests/run_tests.sh
